name: Sync Fork Upstream

   on:
     schedule:
       # GitHub Actions 允许的最短调度周期为每 5 分钟一次（*/5 * * * *）
       - cron: '*/5 * * * *'
     # 依然保留随时手动触发
     workflow_dispatch:

   # 防止上一次任务没跑完时发生冲突
   concurrency:
     group: ${{ github.workflow }}-${{ github.ref }}
     cancel-in-progress: true

   jobs:
     sync:
       name: Sync with upstream (mcncarl/jianying-headless)
       runs-on: ubuntu-latest
       if: github.repository == 'ltzaqmlp/jianying-headless'

       permissions:
         contents: write
         workflows: write

       steps:
         - name: Sync fork via GitHub CLI
           run: |
             gh repo sync "${{ github.repository }}" -b main --source
 mcncarl/jianying-headless
           env:
             GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
